<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Candidates ready to join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --ink:#14212B; --mute:#5B6B77; --line:#D5DCE2;
  --brand:#1F3A4D; --brand-ink:#FFFFFF; --focus:#0B6BCB;
  --now-bg:#DCF2E4; --now-ink:#14532D; --soon-bg:#FFF0CC; --soon-ink:#7A4B00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1A22; --panel:#16252F; --ink:#E8EEF2; --mute:#93A4B1; --line:#2A3C49;
    --brand:#7FB4D6; --brand-ink:#0F1A22; --focus:#7FB4D6;
    --now-bg:#173826; --now-ink:#9BE2B6; --soon-bg:#40320F; --soon-ink:#F2CE7A;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 64px}
header h1{margin:0;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.15;letter-spacing:-.02em;font-weight:700}
header p{margin:6px 0 0;color:var(--mute)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:28px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;position:sticky;top:16px}
@media (max-width:820px){.filters{position:static}}
.filters h2{font-size:.95rem;margin:0 0 10px;font-weight:600}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:600;font-size:.95rem;padding:0;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--brand)}
.opt .n{margin-left:auto;color:var(--mute);font-size:.85rem}
label.f{display:block;font-weight:600;font-size:.95rem;margin-bottom:6px}
input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.field{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.full{width:100%;margin-top:8px}
.results-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.count{font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font-size:.85rem;font-weight:600;color:var(--mute);background:var(--bg);padding-top:10px;padding-bottom:10px}
.name{font-weight:600}
.role{color:var(--mute);font-size:.9rem}
.contact a{display:block;text-decoration:none;overflow-wrap:anywhere}
.contact a:hover{text-decoration:underline}
.contact .none{color:var(--mute)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;border:1px solid var(--line)}
.tag.now{background:var(--now-bg);color:var(--now-ink);border-color:transparent}
.tag.soon{background:var(--soon-bg);color:var(--soon-ink);border-color:transparent}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.note{margin-top:16px;color:var(--mute);font-size:.85rem}
@media (max-width:820px){
  .row.head{display:none}
  .row{grid-template-columns:1fr 1fr;gap:6px 12px}
  .row>.c-name{grid-column:1/-1}
  .row>.c-contact{grid-column:1/-1}
  .row>.c-cv{grid-column:1/-1}
  .row>.c-cv .btn{width:100%}
  .lbl{display:block;font-size:.8rem;color:var(--mute)}
}
@media (min-width:821px){.lbl{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Candidates ready to join</h1>
  <p>Filter by visa status and availability, then download the CV.</p>
</header>

<div class="layout">
  <aside class="filters" aria-label="Filters">
    <div class="field">
      <label class="f" for="q">Search</label>
      <input id="q" type="search" placeholder="Name, role or city" autocomplete="off">
    </div>
    <fieldset id="visa"><legend>Visa status</legend></fieldset>
    <div class="field">
      <label class="f" for="avail">Available within</label>
      <select id="avail">
        <option value="all">Any time</option>
        <option value="0">Immediately</option>
        <option value="3">3 months</option>
        <option value="6">6 months</option>
        <option value="12">12 months</option>
      </select>
    </div>
    <button class="btn full" id="reset" type="button">Clear filters</button>
  </aside>

  <main>
    <div class="results-bar">
      <div class="count" id="count" aria-live="polite"></div>
      <button class="btn primary" id="csv" type="button">Download list (CSV)</button>
    </div>
    <div class="list" id="list">
      <div class="row head" aria-hidden="true"><div>Name</div><div>Contact</div><div>Visa</div><div>Availability</div><div>CV</div></div>
    </div>
    <p class="note">Contains personal data. Only share the link with people who need it.</p>
  </main>
</div>
</div>

<script>
const DATA = [{"name": "A.L. Numan", "role": "Product Designer (UI/UX)", "city": "Bærum", "phone": "+47 968 48 191", "email": "", "visa": "Job seeker", "avail": 0, "cv": "Numan_CV.pdf", "availLabel": "Immediately"}, {"name": "Ansarul Kabir", "role": "Software & Platform Engineer", "city": "Oslo", "phone": "+47 463 83 379", "email": "ansarulsohan@gmail.com", "visa": "Dependent", "avail": 0, "cv": "Ansarul_Kabir_CV_Defendable.pdf", "availLabel": "Immediately"}, {"name": "Boishakhi Ghosh Mukta", "role": "Software Developer", "city": "Oslo", "phone": "+47 966 32 609", "email": "bgmukta11@gmail.com", "visa": "Dependent", "avail": 0, "cv": "Boishakhi_CV.pdf", "availLabel": "Immediately"}, {"name": "Md Faisal Ibnea Hossain", "role": "Junior IT Support / Cloud Security", "city": "Stavanger", "phone": "+47 968 10 121", "email": "faisalhossain477@gmail.com", "visa": "Student", "avail": 0, "cv": "Faisal_IT_Support_CV_Cu.pdf", "availLabel": "Immediately"}, {"name": "Md Mahamodul Islam", "role": "IT Support Engineer", "city": "Oslo", "phone": "+47 465 57 162", "email": "mdmahamodul1998@gmail.com", "visa": "Dependent", "avail": 0, "cv": "IT_Support_Resume_Mahamodul__1_.pdf", "availLabel": "Immediately"}, {"name": "Md Zubayar", "role": "Electrical & Electronics Engineer (Signal Processing)", "city": "Oslo", "phone": "+47 967 15 306", "email": "zubayarofficial@gmail.com", "visa": "Researcher", "avail": 0, "cv": "Md_Zubayar_master_CV_overleaf_ENG.pdf", "availLabel": "Immediately"}, {"name": "Ruhit Rafian Prinon", "role": "Cybersecurity & Cloud Software Engineer", "city": "Norway", "phone": "+47 967 51 307", "email": "ruhitrafian661@gmail.com", "visa": "Dependent", "avail": 0, "cv": "Technical_Resume_SWD.pdf", "availLabel": "Immediately"}, {"name": "S M Shahed Al Mamun", "role": "IT Support", "city": "Oslo", "phone": "+47 969 51 243", "email": "mamun.shahed@gmail.com", "visa": "Pending", "avail": 0, "cv": "Shahed_Mamun_CV__1_.pdf", "availLabel": "Immediately"}, {"name": "Sheikh Tawfique Elahi", "role": "Electrical & Automation Engineer", "city": "Oslo", "phone": "+47 972 55 611", "email": "sheikhtawfiqueee@gmail.com", "visa": "Student", "avail": 0, "cv": "Sheikh_Tawfique_Elahi_CV.pdf", "availLabel": "Immediately"}];
const VISAS = ["Student","Researcher","Dependent","Job seeker","Pending"];
const $ = s => document.querySelector(s);
const state = {q:"", visa:new Set(), avail:"all"};

// build visa checkboxes
const visaBox = $("#visa");
VISAS.forEach(v=>{
  const n = DATA.filter(d=>d.visa===v).length;
  if(!n) return;
  const l = document.createElement("label"); l.className="opt";
  const i = document.createElement("input"); i.type="checkbox"; i.value=v;
  i.addEventListener("change",()=>{ i.checked?state.visa.add(v):state.visa.delete(v); render(); });
  const t = document.createElement("span"); t.textContent=v;
  const c = document.createElement("span"); c.className="n"; c.textContent=n;
  l.append(i,t,c); visaBox.append(l);
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
$("#avail").addEventListener("change",e=>{state.avail=e.target.value;render();});
$("#reset").addEventListener("click",()=>{
  state.q="";state.visa.clear();state.avail="all";
  $("#q").value="";$("#avail").value="all";
  visaBox.querySelectorAll("input").forEach(i=>i.checked=false);render();
});

function filtered(){
  return DATA.filter(d=>{
    if(state.visa.size && !state.visa.has(d.visa)) return false;
    if(state.avail!=="all" && d.avail>Number(state.avail)) return false;
    if(state.q && !(d.name+" "+d.role+" "+d.city).toLowerCase().includes(state.q)) return false;
    return true;
  });
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function render(){
  const list=$("#list");
  list.querySelectorAll(".row:not(.head), .empty").forEach(n=>n.remove());
  const rows=filtered();
  $("#count").textContent = rows.length+" of "+DATA.length+" candidates";
  if(!rows.length){
    const e=el("div","empty"); e.append(el("strong",null,"No candidates match"),document.createTextNode("Clear a filter to see more."));
    list.append(e);return;
  }
  rows.forEach(d=>{
    const r=el("div","row");
    const n=el("div","c-name"); n.append(el("div","name",d.name),el("div","role",d.role+" · "+d.city));
    const c=el("div","contact c-contact");
    const p=el("a",null,d.phone); p.href="tel:"+d.phone.replace(/\s/g,""); c.append(p);
    if(d.email){const m=el("a",null,d.email);m.href="mailto:"+d.email;c.append(m);}else c.append(el("span","none","No email on CV"));
    const v=el("div"); v.append(el("span","lbl","Visa"),el("span","tag",d.visa));
    const a=el("div"); a.append(el("span","lbl","Availability"),el("span","tag "+(d.avail===0?"now":"soon"),d.availLabel));
    const cv=el("div","c-cv"); const b=el("a","btn","Download CV"); b.href=d.cv; b.setAttribute("download",""); b.setAttribute("aria-label","Download CV for "+d.name); cv.append(b);
    r.append(n,c,v,a,cv); list.append(r);
  });
}
$("#csv").addEventListener("click",()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[["Name","Role","City","Phone","Email","Visa status","Availability"].map(q).join(",")];
  filtered().forEach(d=>lines.push([d.name,d.role,d.city,d.phone,d.email,d.visa,d.availLabel].map(q).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="candidates.csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
render();
</script>
</body>
</html>
